<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷炫动画待办清单 · Vita Check</title>
    <link rel="stylesheet" href="css/themes.css?v=3">
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="css/animations.css?v=3">
</head>
<body>
    <!-- 右上角浮动工具（边缘化、弱化显示） -->
    <div class="floating-tools">
        <button id="theme-btn" class="tool-btn" title="切换主题" aria-label="切换主题">🎨</button>
        <button id="settings-btn" class="tool-btn" title="设置" aria-label="打开设置">⚙️</button>
    </div>

    <main class="app" id="app">
        <!-- 精简头部：弱化的进度信息 -->
        <header class="app-header">
            <h1 class="app-title">Vita Check</h1>
            <div class="progress-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="stats-text">
                <strong id="remaining-count">0</strong> 项待完成 · <span id="completion-rate">0%</span>
            </div>
        </header>

        <!-- 待办列表（视觉主角，无边框无背景） -->
        <section class="todo-list-section">
            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

            <!-- 空状态 -->
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">📝</div>
                <p>还没有待办，添加第一条吧</p>
            </div>
        </section>

        <!-- 添加入口（底部，弱化） -->
        <section class="input-section">
            <form id="todo-form" class="todo-form" autocomplete="off">
                <span class="add-glyph" aria-hidden="true">+</span>
                <input
                    type="text"
                    id="todo-input"
                    class="todo-input"
                    placeholder="添加新任务..."
                    maxlength="120"
                    aria-label="输入待办内容"
                >
            </form>
        </section>

        <!-- 底部（弱化说明） -->
        <footer class="app-footer">
            <span class="hint">双击文字编辑 · 点击圆圈或文字完成</span>
            <button id="clear-completed" class="clear-btn" title="清除所有已完成项">清除已完成</button>
        </footer>
    </main>

    <!-- 设置面板 -->
    <aside class="settings-panel" id="settings-panel" aria-hidden="true" aria-label="设置面板">
        <div class="settings-header">
            <h2>设置</h2>
            <button id="close-settings" class="icon-btn" aria-label="关闭设置">✕</button>
        </div>

        <div class="settings-body">
            <!-- 动画风格选择 -->
            <div class="setting-group">
                <label class="setting-label">🎬 划掉动画风格</label>
                <div class="anim-grid" id="anim-grid">
                    <!-- 由 JS 动态生成 -->
                </div>
                <button id="preview-anim" class="preview-btn">▶ 预览当前动画</button>
            </div>

            <!-- 马克笔颜色选择 -->
            <div class="setting-group">
                <label class="setting-label">🖊️ 马克笔颜色</label>
                <div class="marker-colors" id="marker-colors">
                    <!-- 由 JS 动态生成色块 -->
                </div>
                <input type="color" id="marker-color-picker" tabindex="-1" aria-hidden="true">
            </div>

            <!-- 主题切换 -->
            <div class="setting-group">
                <label class="setting-label">🎨 主题配色</label>
                <div class="theme-options" id="theme-options">
                    <button class="theme-option" data-theme="light">☀️ 亮色</button>
                    <button class="theme-option" data-theme="dark">🌙 暗色</button>
                    <button class="theme-option" data-theme="gradient">🌈 渐变</button>
                </div>
            </div>

            <!-- 音效开关 -->
            <div class="setting-group">
                <label class="setting-label" for="sound-toggle">🔊 音效</label>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="settings-footer">
            <button id="reset-data" class="danger-btn">清空所有数据</button>
        </div>
    </aside>
    <div class="settings-overlay" id="settings-overlay" aria-hidden="true"></div>

    <!-- CDN 与脚本 -->
    <script src="js/storage.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
